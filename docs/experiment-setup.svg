<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Weight-space experiment setup</title>
  <desc id="desc">Source code and aggregate results are backed up locally and published to a public GitHub repository. Private data and all target-model computation stay on Remote worker. Training and validation drive bounded edits; a separate final set stays sealed until all candidates are frozen. Supervised references and model sizes are compared separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fa4bd"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#86aafc"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#e7edf7} .title{font-size:36px;font-weight:750;letter-spacing:-.7px}.subtitle{font-size:18px;fill:#a7bbd1}.h{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#a7bbd1}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#b3c5dd}.box{fill:#111d2e;stroke:#304158;stroke-width:1.5}.flow{fill:none;stroke:#8fa4bd;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#86aafc;stroke-width:2.4;marker-end:url(#blue)}.thin{fill:none;stroke:#667f9b;stroke-width:1.5;stroke-dasharray:5 5}.stat{font-size:36px;font-weight:750}.note{font-size:15px;fill:#a7bbd1}
  </style>
  </defs>
  <rect width="1600" height="1080" fill="#0b1220"/>
  <text x="48" y="65" class="title">Weight-space experiment</text>
  <text x="48" y="99" class="subtitle">Cause classification from disruption text · completed research setup · 3 November 2026</text>
  <rect x="350" y="145" width="1202" height="860" rx="24" fill="#101e31" stroke="#304b69" stroke-width="2"/>
  <text x="383" y="184" class="h">Remote worker</text>
  <text x="650" y="182" class="small">Inference, feature fitting, bounded edits and scoring</text>

  <rect x="48" y="145" width="265" height="290" rx="18" class="box"/>
  <text x="72" y="179" class="eyebrow">LOCAL WORKSPACE</text>
  <text x="72" y="216" class="h">Source + backup</text>
  <text x="72" y="255" class="body"><tspan x="72">Harness and tests</tspan><tspan x="72" dy="29">Frozen registrations</tspan><tspan x="72" dy="29">Complete Git bundle</tspan><tspan x="72" dy="29">Aggregate reports + SVG</tspan></text>
  <text x="72" y="400" class="small">No local model computation</text>
  <path d="M313 253H350" class="flow"/>
  <path d="M350 383H313" class="flow"/>

  <rect x="48" y="485" width="265" height="185" rx="18" class="box"/>
  <text x="72" y="520" class="eyebrow">PUBLIC GITHUB REPO</text>
  <text x="72" y="557" class="h">Research history</text>
  <text x="72" y="594" class="body"><tspan x="72">Code and hypotheses</tspan><tspan x="72" dy="28">Aggregate result history</tspan></text>
  <path d="M180 435V485" class="flow"/>

  <rect x="48" y="720" width="265" height="230" rx="18" fill="#111d2e" stroke="#304158"/>
  <text x="72" y="755" class="eyebrow">PRIVATE EVIDENCE</text>
  <text x="72" y="790" class="h">Owner storage</text>
  <text x="72" y="830" class="body"><tspan x="72">Raw corpus and run records</tspan><tspan x="72" dy="29">Integrity manifest + failures</tspan></text>
  <text x="72" y="906" class="small"><tspan x="72">Server-to-server archive</tspan><tspan x="72" dy="22">First transfer pending receipt</tspan></text>
  <path d="M350 835H313" class="flow"/>

  <rect x="385" y="210" width="510" height="112" rx="16" class="box"/>
  <text x="409" y="244" class="h">Private source corpus</text>
  <text x="409" y="274" class="body">Private text examples + source category labels</text>
  <text x="409" y="300" class="small">Incident/template groups · labels are source metadata</text>

  <rect x="930" y="210" width="585" height="112" rx="16" fill="#16332c" stroke="#356a55"/>
  <text x="954" y="243" class="eyebrow" style="fill:#8bd9b0">TRIAL 01 · COMPLETE · NO IMPROVING EDIT</text>
  <text x="954" y="275" class="body">Three editor runs retained unchanged model.</text>
  <text x="954" y="301" class="small">Final: 182 groups · 37.4% accuracy · 42.3% balanced accuracy</text>

  <path d="M640 322V342H505V365" class="flow"/>
  <path d="M640 342H785V365" class="flow"/>
  <path d="M640 342H1335V365" class="flow"/>
  <rect x="385" y="365" width="245" height="115" rx="16" fill="#183b30" stroke="#356a55"/>
  <text x="407" y="396" class="eyebrow">TRAINING</text><text x="407" y="441" class="stat">138</text><text x="500" y="438" class="body">groups</text>
  <text x="407" y="466" class="small">Training features + labels</text>
  <rect x="660" y="365" width="245" height="115" rx="16" fill="#1a3153" stroke="#456591"/>
  <text x="682" y="396" class="eyebrow">VALIDATION</text><text x="682" y="441" class="stat">80</text><text x="752" y="438" class="body">groups</text>
  <text x="682" y="466" class="small">Compare and select candidates</text>
  <rect x="1155" y="365" width="360" height="115" rx="16" fill="#382b17" stroke="#997a49"/>
  <text x="1178" y="397" class="eyebrow" style="fill:#f0c47c">FINAL · EVALUATED</text><text x="1178" y="442" class="stat">93</text><text x="1248" y="438" class="body">previously unused groups</text>
  <text x="1178" y="466" class="small">Choices frozen before evaluation</text>

  <path d="M505 480V545" class="flow"/>
  <rect x="385" y="545" width="265" height="180" rx="16" class="box"/>
  <text x="407" y="580" class="h">Target models</text>
  <text x="407" y="615" class="body"><tspan x="407">Qwen3.5 · BF16</tspan><tspan x="407" dy="29">2B / 4B / 9B references</tspan><tspan x="407" dy="29">4B internal weight edits</tspan></text>
  <text x="407" y="706" class="small">2B + 4B fit; 9B runs sequentially</text>

  <path d="M650 625H695" class="feedback"/>
  <rect x="695" y="545" width="395" height="180" rx="16" fill="#1a3153" stroke="#5c7fb6" stroke-width="2"/>
  <text x="720" y="580" class="h">Weight-edit research loop</text>
  <text x="720" y="614" class="body"><tspan x="720">Training activations → diagnosis</tspan><tspan x="720" dy="28">Editor client → hosted Astra → code</tspan><tspan x="720" dy="28">NumPy sandbox → bounded BF16 patch</tspan></text>
  <text x="720" y="708" class="small">≤20 edits · no gradients · failures retained</text>
  <path d="M1090 632H1155" class="flow"/>
  <rect x="1155" y="545" width="360" height="180" rx="16" class="box"/>
  <text x="1178" y="581" class="h">Validation scorer</text>
  <text x="1178" y="618" class="body"><tspan x="1178">Balanced accuracy + accuracy</tspan><tspan x="1178" dy="28">Per-class recall and support</tspan><tspan x="1178" dy="28">Changed outputs, memory, time</tspan></text>
  <text x="1178" y="708" class="small">Original model remains eligible</text>
  <path d="M785 480V508H1250V545" class="flow"/>
  <path d="M1155 588H1090" class="feedback"/>
  <text x="1095" y="576" style="font-size:12px;fill:#86aafc">feedback</text>

  <path d="M510 725V800" class="flow"/>
  <rect x="385" y="800" width="705" height="130" rx="16" class="box"/>
  <text x="408" y="837" class="h">Supervised references · separate from weight editing</text>
  <text x="408" y="870" class="body">Frozen model features → nearest centroid / ridge classifier</text>
  <text x="408" y="904" class="small">Fit on 138 · select on 80 · model weights unchanged · same split for every model size</text>
  <path d="M1090 840H1120V690H1155" class="flow"/>

  <path d="M1335 725V800" class="flow"/>
  <text x="1350" y="765" class="small">freeze all choices</text>
  <path d="M1515 420H1535V865H1515" class="flow"/>
  <rect x="1155" y="800" width="360" height="130" rx="16" fill="#382b17" stroke="#997a49"/>
  <text x="1178" y="836" class="h">One final evaluation</text>
  <text x="1178" y="870" class="body">Same 93 records · all frozen arms</text>
  <text x="1178" y="904" class="small">Paired uncertainty · no tuning or retries</text>
  <text x="385" y="975" class="note">Raw messages, activations and per-record outputs stay remote. Local/GitHub results are aggregate only.</text>
  <text x="48" y="1040" class="small">Development experiment, coordinator-executed, not independently qualified. New 93-group final set is not a new temporal holdout.</text>
</svg>
